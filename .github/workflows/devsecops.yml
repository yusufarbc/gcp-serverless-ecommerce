name: DevSecOps Pipeline

on:
  push:
    branches: [production, staging]
  pull_request:
    branches: [production, staging]
  schedule:
    # Run every Monday at 04:00 UTC for automated weekly security compliance
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. SECRET SCANNING: Gitleaks
  # ----------------------------------------------------------------------------
  gitleaks:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------------
  # 2. SAST: Semgrep
  # ----------------------------------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Rules
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/react" \
            --config "p/security-audit" \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # 3. SAST: GitHub CodeQL
  # ----------------------------------------------------------------------------
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ----------------------------------------------------------------------------
  # 4. SCA: Dependency & Vulnerability Scanning (Trivy)
  # ----------------------------------------------------------------------------
  sca:
    name: SCA & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # 5. SBOM: Software Bill of Materials (CycloneDX & SPDX)
  # ----------------------------------------------------------------------------
  sbom:
    name: SBOM Generation (CycloneDX & SPDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "cyclonedx"
          output: "sbom-cyclonedx.json"

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "spdx-json"
          output: "sbom-spdx.json"

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
          retention-days: 30
