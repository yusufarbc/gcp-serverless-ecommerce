name: Deploy Backend to Cloud Run
# Automated deployment disabled: Project runs as open-source portfolio demo
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment (staging or production)'
        required: true
        default: 'staging'
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: gcp-serverless-ecommerce
  REGION: europe-west3
  GAR_REPO: apps
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Environment Variables
        id: set-env
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.target_env }}
        run: |
          DEPLOY_ENV="${INPUT_ENV:-$REF_NAME}"
          if [ "$DEPLOY_ENV" = "staging" ]; then
            echo "service_name=commerce-core-api-staging" >> $GITHUB_OUTPUT
            echo "env_file=backend-env.staging.yaml" >> $GITHUB_OUTPUT
            echo "image_tag=staging" >> $GITHUB_OUTPUT
            echo "max_instances=2" >> $GITHUB_OUTPUT
          else
            echo "service_name=commerce-core-api" >> $GITHUB_OUTPUT
            echo "env_file=backend-env.prod.yaml" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "max_instances=3" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Backend Container Image
        run: |
          IMAGE_TAG="${{ steps.set-env.outputs.image_tag }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/medusa-backend:${{ github.sha }}"
          docker build -t $IMAGE -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/medusa-backend:$IMAGE_TAG" -f apps/backend/Dockerfile .
          docker push --all-tags "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/medusa-backend"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/medusa-backend:${{ github.sha }}"
          gcloud run deploy ${{ steps.set-env.outputs.service_name }} \
            --image=$IMAGE \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --env-vars-file=${{ steps.set-env.outputs.env_file }} \
            --port=9000 \
            --min-instances=0 \
            --max-instances=${{ steps.set-env.outputs.max_instances }} \
            --memory=1Gi \
            --cpu=1 \
            --concurrency=40 \
            --project=${{ env.PROJECT_ID }}
