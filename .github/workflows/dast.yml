name: DAST Security Pipeline (OWASP ZAP)

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday night scan at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read
  issues: write

jobs:
  zap_storefront:
    name: DAST - OWASP ZAP Storefront Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan (Storefront)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://commerce-storefront-pwa-staging-989797182050.europe-west3.run.app"
          allow_issue_writing: false
          artifact_name: "zap-storefront-scan-report"

  zap_api:
    name: DAST - OWASP ZAP Core API Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP API Scan (Core API)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "https://commerce-core-api-staging-989797182050.europe-west3.run.app/health"
          format: "openapi"
          allow_issue_writing: false
          artifact_name: "zap-api-scan-report"
        continue-on-error: true
