name: Terraform Pipeline
on:
  push:
    branches: [production, staging]
    paths: ["infra/terraform/**"]
  pull_request:
    branches: [production, staging]
    paths: ["infra/terraform/**"]
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: gcp-serverless-ecommerce
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Terraform Root Directory
        id: set-tf-dir
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "staging" ]; then
            echo "tf_root=infra/terraform/environments/staging" >> $GITHUB_OUTPUT
          else
            echo "tf_root=infra/terraform/environments/prod" >> $GITHUB_OUTPUT
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Validate Terraform Format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform Init (Offline / No Backend)
        working-directory: ${{ steps.set-tf-dir.outputs.tf_root }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ steps.set-tf-dir.outputs.tf_root }}
        run: terraform validate
