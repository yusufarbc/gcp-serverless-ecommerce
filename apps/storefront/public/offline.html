<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Apex Direct Europe</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 4rem 1.5rem; color: #111827; background-color: #f9fafb;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">📡</div>
  <h1 style="margin-bottom: 0.5rem;">You are currently offline</h1>
  <p style="color: #6b7280; max-width: 400px; margin: 0 auto 1.5rem auto; line-height: 1.5;">
    Please check your internet connection to continue browsing our European store.
  </p>
  <button onclick="window.location.reload()" style="background-color: #2563eb; color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 0.375rem; font-weight: 600; cursor: pointer;">
    Retry Connection
  </button>
</body>
</html>
