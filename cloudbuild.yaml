steps:
  # 1. Build Backend Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/gcp-serverless-ecommerce/apps/commerce-core-api:latest'
      - '-f'
      - 'apps/backend/Dockerfile'
      - '.'

  # 2. Build Storefront Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/gcp-serverless-ecommerce/apps/commerce-storefront-pwa:latest'
      - '-f'
      - 'apps/storefront/Dockerfile'
      - '.'

images:
  - 'europe-west3-docker.pkg.dev/gcp-serverless-ecommerce/apps/commerce-core-api:latest'
  - 'europe-west3-docker.pkg.dev/gcp-serverless-ecommerce/apps/commerce-storefront-pwa:latest'

options:
  machineType: 'E2_HIGHCPU_8'

